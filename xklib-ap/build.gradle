plugins {
    id 'java'
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id "com.vanniktech.maven.publish"
}

group = 'com.xkball.xklib.ap'
version = xklib_version

repositories {
    mavenCentral()
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

jar {
    manifest {
        attributes(
                'Automatic-Module-Name': 'com.xkball.xklib.ap'
        )
    }
}

dependencies {
    implementation "com.google.auto.service:auto-service:$autoServiceVersion"
    annotationProcessor "com.google.auto.service:auto-service:$autoServiceVersion"
}

mavenPublishing {
    publishToMavenCentral(true)
    signAllPublications()
    coordinates("com.xkball", "xklib-ap", version)

    pom {
        name = "xklib-ap"
        url = "https://github.com/xkball/xklib-ui"
        description = "a minecraft mod lib."

        licenses {
            license {
                name = 'GNU LESSER GENERAL PUBLIC LICENSE Version 3 '
                url = 'https://www.gnu.org/licenses/lgpl-3.0.html'
            }
        }

        developers {
            developer {
                id = 'xkball'
                name = 'xkball'
                email = 'xkball996@gmail.com'
            }
        }

        scm {
            connection = 'scm:git:git://github.com/xkball/xklib-ui.git'
            developerConnection = 'scm:git:ssh://github.com/xkball/xklib-ui.git'
            url = 'https://github.com/xkball/xklib-ui/tree/master'
        }
    }
}