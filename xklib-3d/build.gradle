plugins {
    id 'java'
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id "com.vanniktech.maven.publish"
}

group = 'com.xkball.xklib.x3d'
version = '0.0.1'

repositories {
    mavenCentral()
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

dependencies {

    api platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    api "org.joml:joml:1.10.7"
    api "org.joml:joml-primitives:1.10.0"
    api "it.unimi.dsi:fastutil:8.5.18"
    api "com.google.guava:guava:33.5.0-jre"
    api "com.ibm.icu:icu4j:77.1"
    api "org.slf4j:slf4j-api:2.0.17"

    //need jij
    api "net.lenni0451:LambdaEvents:2.4.2"

    api project(":xklib-ap")
    api "com.google.auto.service:auto-service:1.1.1"
    annotationProcessor project(":xklib-ap")
    annotationProcessor "com.google.auto.service:auto-service:1.1.1"

    api "org.lwjgl:lwjgl"
    api "org.lwjgl:lwjgl-glfw"
    api "org.lwjgl:lwjgl-stb"

    runtimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-stb::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNatives"

    api "org.apache.logging.log4j:log4j-api:2.25.2"
    api 'org.apache.logging.log4j:log4j-core:2.25.2'
    annotationProcessor 'org.apache.logging.log4j:log4j-core:2.25.2'

    runtimeOnly "org.apache.logging.log4j:log4j-slf4j2-impl:2.25.2"

    runtimeOnly project(":xklib-3d-gl")

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

jar {
    manifest {
        attributes(
                'Automatic-Module-Name': 'com.xkball.xklib'
        )
    }
}

test {
    useJUnitPlatform()
}

mavenPublishing {
    publishToMavenCentral(true)
    signAllPublications()
    coordinates("com.xkball", "xklib-3d", version)

    pom {
        name = "xklib-3d"
        url = "https://github.com/xkball/xklib-ui"
        description = "a minecraft mod lib."

        licenses {
            license {
                name = 'GNU LESSER GENERAL PUBLIC LICENSE Version 3 '
                url = 'https://www.gnu.org/licenses/lgpl-3.0.html'
            }
        }

        developers {
            developer {
                id = 'xkball'
                name = 'xkball'
                email = 'xkball996@gmail.com'
            }
        }

        scm {
            connection = 'scm:git:git://github.com/xkball/xklib-ui.git'
            developerConnection = 'scm:git:ssh://github.com/xkball/xklib-ui.git'
            url = 'https://github.com/xkball/xklib-ui/tree/master'
        }
    }
}